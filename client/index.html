<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Battleship</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="oceanCanvas"></canvas>
  <button id="muteBtn" class="mute-btn" title="Mute sound" aria-label="Mute sound">🔊</button>

  <main id="app">
    <h1 class="title">BATTLESHIP</h1>
    <p id="onlineBanner" class="online-banner hidden"></p>

    <section id="menu" class="panel">
      <button id="vsComputerBtn" class="btn btn-primary">Play vs Computer</button>
      <button id="createBtn" class="btn">Create Room</button>
      <div class="join-row">
        <input id="joinInput" type="text" placeholder="ROOM CODE" maxlength="10" />
        <button id="joinBtn" class="btn">Join</button>
      </div>
      <p id="menuError" class="error"></p>
    </section>

    <section id="room" class="panel hidden">
      <p class="label">Room Code</p>
      <p id="roomCode" class="room-code"></p>
      <p id="roomStatus" class="status">Waiting for opponent…</p>
      <button id="roomBackBtn" class="btn btn-ghost">← Back to Menu</button>
    </section>

    <section id="placement" class="screen hidden">
      <div class="placement-layout">
        <div class="board-wrap">
          <div id="placementGrid" class="grid"></div>
        </div>
        <aside class="ship-tray-panel">
          <h2>Deploy Your Fleet</h2>
          <div id="shipTray" class="ship-tray"></div>
          <p id="placementStatus" class="status"></p>
          <div id="difficultyPicker" class="difficulty-picker">
            <p class="label">AI Difficulty</p>
            <div class="difficulty-options">
              <button class="btn difficulty-btn" data-difficulty="easy">Easy</button>
              <button class="btn difficulty-btn selected" data-difficulty="medium">Medium</button>
              <button class="btn difficulty-btn" data-difficulty="hard">Hard</button>
            </div>
          </div>
          <div class="tray-actions">
            <button id="rotateBtn" class="btn">Rotate (R)</button>
            <button id="randomizeBtn" class="btn">Randomize</button>
            <button id="readyBtn" class="btn btn-primary" disabled>Ready</button>
          </div>
          <button id="backToMenuBtn" class="btn btn-ghost">← Back to Menu</button>
        </aside>
      </div>
    </section>

    <section id="battle" class="screen hidden">
      <p id="turnIndicator" class="turn-indicator"></p>
      <div class="battle-layout">
        <div class="board-col">
          <h3>Your Fleet</h3>
          <div class="board-wrap">
            <div id="ownGrid" class="grid battle-grid"></div>
          </div>
        </div>
        <div class="board-col">
          <h3>Enemy Waters</h3>
          <div class="board-wrap">
            <div id="enemyGrid" class="grid battle-grid"></div>
          </div>
        </div>
      </div>

      <div id="gameOverOverlay" class="game-over hidden">
        <p id="gameOverTitle" class="game-over-title"></p>
        <p id="gameOverStats" class="game-over-stats"></p>
        <button id="playAgainBtn" class="btn btn-primary">Back to Menu</button>
      </div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/battleshipLogic.js"></script>
  <script src="js/ocean.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/placement.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/onlineBattle.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
